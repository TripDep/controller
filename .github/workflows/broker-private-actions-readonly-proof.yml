name: Broker private Actions READ-ONLY proof (NO MERGE)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-private-actions-read:
    name: broker-private-actions-read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: broker-approval
    steps:
      - name: Enforce protected public main
        shell: bash
        run: test "$GITHUB_REPOSITORY" = "TripDep/controller" && test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require broker disabled
        run: python3 -m unittest discover -s broker -p 'test_policy_preflight.py' -v
      - name: Mint ephemeral token with READ permissions only
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: '5293734'
          private-key: ${{ secrets.BROKER_APP_PRIVATE_KEY }}
          owner: TripDep
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
      - name: Verify private Actions API permission and pinned workflow source
        env:
          BROKER_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: python3 broker/verify_private_actions_readonly.py

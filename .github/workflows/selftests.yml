name: Public controller selftests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Public controller synthetic tests
        run: python3 -m unittest discover -s supervisor -p 'test_*.py' -v
      - name: Verify Git broker remains unarmed
        run: python3 -m unittest discover -s broker -p 'test_policy_preflight.py' -v
      - name: Verify read-only App installation scope and fail-closed behavior
        run: python3 -m unittest discover -s broker -p 'test_verify_app_installation.py' -v
      - name: Verify staged broker v5 modules and negative gates without credentials
        working-directory: broker
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Explicit C07 153 canonical sources and MG0 fail-closed tests
        working-directory: broker
        run: python3 -m unittest -v test_c07_non_aaa_153
      - name: C07 110 individual anti-regression negative tests
        working-directory: broker
        run: python3 -m unittest -v test_c07_behavior_110
      - name: Syntax and policy checks
        run: |
          python3 -m py_compile supervisor/controller.py broker/verify_app_installation.py
          python3 -m json.tool supervisor/policy.json > /dev/null
